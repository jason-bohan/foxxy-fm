<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM-1 · DEV SCREEN</title>
<style>
  :root { --bg:#101213; --panel:#1a1d1f; --panel-2:#141719; --ink:#e8eaed; --ink-2:#9aa0a6; --line:#2b2f33;
          --accent:#ffe18a; --blue:#5a9cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.5 ui-monospace, Menlo, monospace;
         display:flex; flex-direction:column; min-height:100vh; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--panel);
           border-bottom:1px solid var(--line); }
  header b { letter-spacing:.12em; }
  header .sub { color:var(--ink-2); }
  header .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
  main { flex:1; display:flex; gap:14px; padding:14px; flex-wrap:wrap; align-items:flex-start; justify-content:center; }
  .screenbox { background:#000; border:1px solid var(--line); border-radius:6px; padding:10px; }
  canvas#scr { width:360px; height:360px; image-rendering:pixelated; display:block; }
  .cap { margin-top:8px; color:var(--ink-2); font-size:11px; text-align:center; }
  fieldset { border:1px solid var(--line); border-radius:6px; margin:0; padding:10px; background:var(--panel);
             min-width:250px; }
  legend { color:var(--ink-2); padding:0 6px; letter-spacing:.1em; }
  select, input[type=number] { background:var(--panel-2); color:var(--ink); border:1px solid var(--line);
    border-radius:4px; padding:4px 6px; font:inherit; margin:2px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0; align-items:center; }
  button { background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:4px;
    padding:5px 8px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--ink-2); }
  button.on { background:var(--accent); color:#000; border-color:var(--accent); }
  button.pad { background:#141719; min-width:58px; padding:10px 6px; border-radius:8px; letter-spacing:.06em; }
  button.pad.on { background:var(--accent); color:#000; }
  button#sound.pri { border-color:var(--accent); color:var(--accent); margin-right:8px; }
  button#sound.on { background:var(--accent); color:#000; }
  .btn-grid { display:grid; grid-template-columns:repeat(7, auto); gap:4px; }
  .enc { display:flex; align-items:center; gap:6px; }
  .enc canvas { width:46px; height:46px; }
  .enc b { min-width:52px; color:var(--ink-2); font-weight:400; }
  .enc .v { width:34px; text-align:center; color:var(--ink-2); }
  .enc button { min-width:22px; }
  .feat { display:flex; gap:4px; flex-wrap:wrap; }
  .feat i { font-style:normal; font-size:10px; color:var(--ink-2); margin-left:6px; }
  #err { color:#ff8a8a; }
  .mono { color:var(--ink-2); font-size:11px; margin-top:8px; }
  /* keybed */
  .bed { display:flex; position:relative; height:58px; }
  .bed .wk { flex:1; background:#f2f0e8; border-radius:0 0 4px 4px; margin:0 0.5px; position:relative;
            transition:background .05s; z-index:1; }
  .bed .wk.on { background:var(--accent); }
  .bed .bk { position:absolute; width:7px; height:36px; background:#202225; border-radius:0 0 2px 2px; z-index:2; }
  .bed .bk.on { background:var(--blue); }
</style>
</head>
<body>
<header>
  <span class="dot"></span><b>FELUCCA FM-1</b><span class="sub">dev screen — the real firmware UI, on canvas</span>
  <span id="err"></span>
</header>
<main>
  <div class="screenbox">
    <canvas id="scr" width="240" height="240"></canvas>
    <div class="cap" id="cap">loading…</div>
  </div>
  <div style="display:flex; flex-direction:column; gap:12px;">
    <fieldset>
      <legend>NAVIGATION</legend>
      <div class="row"><label>family <select id="fam"></select></label>
           <label>page <select id="pg"></select></label></div>
      <div class="row"><label>track <select id="trk"></select></label>
           <label>bpm <input id="bpm" type="number" min="40" max="220" value="120" style="width:64px"></label>
           <button id="play">PLAY</button></div>
    </fieldset>
    <fieldset>
      <legend>SOUND</legend>
      <div class="row">
        <button id="sound" class="pri">SOUND OFF</button>
        <div class="enc"><canvas id="volc" width="46" height="46"></canvas><b>MASTER</b><span class="v" id="volv">50</span></div>
      </div>
    </fieldset>
    <fieldset>
      <legend>PANEL</legend>
      <div class="btn-grid" id="btns"></div>
    </fieldset>
    <fieldset>
      <legend>KEYS · the 16 white keys + 11 black (F3 = 0)</legend>
      <div class="bed" id="bed"></div>
    </fieldset>
    <fieldset>
      <legend>ENCODERS</legend>
      <div id="encs"></div>
    </fieldset>
  </div>
</main>
<script type="module">
  import createDevScreen from "./devscreen.core.mjs";

  const NAME = "C: FM-1 · DEV SCREEN",
        canvas = document.getElementById("scr"),
        ctx = canvas.getContext("2d"),
        PANEL = ["FX", "SEL", "ENV", "LFO", "EDIT", "GLO", "HOME", "SAVE",
                 "ARP", "SEQ", "PLAY", "REC", "OCT-", "OCT+"],
        ENCS = ["SELECT", "ALGO", "PRES", "K1", "K2", "K3", "K4"];

  document.title = NAME;
  let M = null, famSel, pgSel, trkSel, nonblack = 0;

  function title(p) { return M.UTF8ToString(M._ds_page_title(p)); }

  function refresh() {
    if (!M) return;
    document.getElementById("cap").textContent =
      `${M._ds_ms()} ms · page ${M._ds_cur_page()} · track ${M._ds_selected_track()} · ` +
      (M._ds_playing() ? "PLAYING" : "stopped") + ` · ${nonblack}% lit`;
  }

  let frames = 0, lastSample = 0;

  function paint() {
    const base = M._ds_screen() >> 1, u16 = M.HEAPU16, img = new ImageData(240, 240);
    const d = img.data, px = u16;
    let lit = 0;
    for (let i = 0, j = 0; i < 240 * 240; i++, j += 4) {
      let v = px[base + i];
      v = ((v >> 8) & 0xff) | ((v & 0xff) << 8);
      d[j]     = (v >> 11) * 255 / 31 | 0;
      d[j + 1] = ((v >> 5) & 63) * 255 / 63 | 0;
      d[j + 2] = (v & 31) * 255 / 31 | 0;
      d[j + 3] = 255;
      lit += v !== 0;
    }
    ctx.putImageData(img, 0, 0);
    frames++;
    if (frames - lastSample >= 30) { lastSample = frames; nonblack = Math.round(lit * 100 / 57600); }
  }

  function rebuildPages() {
    famSel = document.getElementById("fam"); pgSel = document.getElementById("pg");
    famSel.textContent = "";
    for (let f = 0; f < M._ds_family_count(); f++) {
      const o = document.createElement("option");
      o.value = f; o.textContent = `${f}: ${M.UTF8ToString(M._ds_family_title(f))}`;
      famSel.appendChild(o);
    }
    famSel.addEventListener("change", () => M._ds_open_family(+famSel.value));
    pgSel.addEventListener("change", () => M._ds_set_page(+pgSel.value));
    syncPages();
  }
  function syncPages() {
    pgSel.textContent = "";
    for (let p = 0; p < M._ds_page_count(); p++) {
      const o = document.createElement("option");
      o.value = p; o.textContent = `${p}: ${title(p)}`;
      pgSel.appendChild(o);
    }
    pgSel.value = "" + M._ds_cur_page();
  }
  function rebuildTracks() {
    trkSel = document.getElementById("trk");
    for (let t = 0; t < 4; t++) {
      const o = document.createElement("option");
      o.value = t; o.textContent = `track ${t + 1}${t === 3 ? " (drums)" : ""}`;
      trkSel.appendChild(o);
    }
    trkSel.addEventListener("change", () => M._ds_select_track(+trkSel.value));
  }
  function buildPanel() {
    const box = document.getElementById("btns");
    PANEL.forEach((n, i) => {
      const b = document.createElement("button");
      b.className = "pad"; b.textContent = n;
      b.addEventListener("pointerdown", (e) => { e.preventDefault(); e.target.setPointerCapture(e.pointerId); M._ds_press(i); b.classList.add("on"); });
      b.addEventListener("pointerup",   (e) => { e.preventDefault(); M._ds_release(i); b.classList.remove("on"); });
      b.addEventListener("pointercancel", () => { M._ds_release(i); b.classList.remove("on"); });
      box.appendChild(b);
    });
  }
  const WK_OF = (w) => Math.floor(w / 7) * 12 + [0, 2, 4, 6, 7, 9, 11][w % 7],  /* white key w -> firmware key index (F3 = 0) */
        BED_BLACK = [0, 1, 2, 4, 5, 7, 8, 9, 11, 12, 14];                      /* black keys, after white w */
  function buildKeys() {
    const bed = document.getElementById("bed");
    const hit = (el, d) => { const k = +el.dataset.k; if (k >= 0) { M._ds_key(k, d); el.classList.toggle("on", !!d); } };
    for (let w = 0; w < 16; w++) {
      const wk = document.createElement("div");
      wk.className = "wk"; wk.dataset.k = WK_OF(w);
      wk.addEventListener("pointerdown", (e) => { e.preventDefault(); hit(wk, 1); });
      wk.addEventListener("pointerup",   (e) => { e.preventDefault(); hit(wk, 0); });
      wk.addEventListener("pointercancel", () => hit(wk, 0));
      bed.appendChild(wk);
    }
    for (const w of BED_BLACK) {
      const bk = document.createElement("div");
      bk.className = "bk"; bk.dataset.k = WK_OF(w) + 1;
      bk.style.left = `calc(${(w + 1) * 6.25}% - 4px)`;
      bk.addEventListener("pointerdown", (e) => { e.preventDefault(); hit(bk, 1); });
      bk.addEventListener("pointerup",   (e) => { e.preventDefault(); hit(bk, 0); });
      bk.addEventListener("pointercancel", () => hit(bk, 0));
      bed.appendChild(bk);
    }
  }
  const KNOB_TURN = 4;                              /* one encoder detent per 4 px of drag */
  function paintKnob(c, a01, gold) {
    const g = c.getContext("2d"); g.clearRect(0, 0, 46, 46); g.lineCap = "round";
    g.strokeStyle = "#2b2f33"; g.lineWidth = 5;
    g.beginPath(); g.arc(23, 23, 18, 0, Math.PI * 2); g.stroke();
    const a0 = -Math.PI * 0.75, a = a0 + a01 * Math.PI * 1.5;
    g.strokeStyle = gold ? "#ffe18a" : "#5a9cff";
    g.beginPath(); g.arc(23, 23, 18, a0, a); g.stroke();
    g.fillStyle = "#e8eaed"; g.beginPath(); g.arc(23, 23, 11, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#101213"; g.beginPath(); g.arc(23, 23, 6, a - Math.PI / 9, a + Math.PI / 9); g.fill();
  }
  function dragKnob(c, set) {
    let drag = null;
    c.addEventListener("pointerdown", (e) => { drag = e.clientY; c.setPointerCapture(e.pointerId); });
    c.addEventListener("pointermove", (e) => {
      if (drag == null) return;
      const nTurn = Math.trunc((drag - e.clientY) / KNOB_TURN);
      if (nTurn === 0) return;
      drag = e.clientY; set(nTurn);
    });
    const lift = () => { drag = null; };
    c.addEventListener("pointerup", lift); c.addEventListener("pointercancel", lift);
  }
  function buildEncs() {
    const box = document.getElementById("encs"), ang = [0, 0, 0, 0, 0, 0, 0];
    ENCS.forEach((n, i) => {
      const row = document.createElement("div"); row.className = "enc";
      const c = document.createElement("canvas"); c.width = c.height = 46;
      const lab = document.createElement("b"); lab.textContent = n;
      const v = document.createElement("span"); v.className = "v"; v.textContent = "0";
      row.append(c, lab, v); box.appendChild(row);
      dragKnob(c, (d) => {
        ang[i] += d; M._ds_turn(i, d); v.textContent = String(ang[i]);
        paintKnob(c, ((ang[i] % 90) + 90) % 90 / 90, i === 0);
      });
      paintKnob(c, 0, i === 0);
    });
  }
  /* the mix, real time: the audio ISR (ds_audio) drives the device, so the JS loop stops calling
     ds_frame while the sound is on — what you see and what you hear stay in one clock. */
  let ac = null, soundOn = false;
  function startSound() {
    if (ac) { ac.resume(); return; }
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createScriptProcessor(2048, 0, 2);
    const out = new Float32Array(M.HEAPU8.buffer, M._ds_out(), 2 * 2048);
    src.onaudioprocess = (e) => {
      M._ds_audio(2048);
      const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
      for (let i = 0, j = 0; i < 2048; i++, j += 2) { L[i] = out[j]; R[i] = out[j + 1]; }
    };
    src.connect(ac.destination);
    M._ds_audio_enable(1); soundOn = true;
    paintVol();
  }
  function stopSound() { if (ac && ac.state === "running") ac.suspend(); }
  function paintVol() {
    const c = document.getElementById("volc");
    document.getElementById("volv").textContent = String(vol);
    paintKnob(c, vol / 100, true);
  }
  let vol = 50;
  function buildSound() {
    const snd = document.getElementById("sound"), c = document.getElementById("volc");
    c.width = c.height = 46;
    M._ds_master(Math.round(vol * 40.96));
    dragKnob(c, (d) => {
      vol = Math.max(0, Math.min(100, vol + d));
      M._ds_master(Math.round(vol * 40.96));
      paintVol();
    });
    snd.addEventListener("click", () => {
      if (!soundOn) { startSound(); snd.textContent = "SOUND ON"; snd.classList.add("on"); }
      else { stopSound(); snd.classList.remove("on"); snd.textContent = ac.state === "suspended" ? "SOUND OFF" : "SOUND ON"; }
    });
    paintVol();
  }
  function wireMix() {
    document.getElementById("play").addEventListener("click", (e) => {
      const on = !M._ds_playing();
      M._ds_play(on ? 1 : 0);
      e.target.textContent = on ? "STOP" : "PLAY";
      e.target.classList.toggle("on", on);
    });
    document.getElementById("bpm").addEventListener("change", (e) => M._ds_set_bpm(+e.target.value));
  }

  try {
    M = await createDevScreen();
    M._ds_init();
    document.getElementById("cap").textContent =
      `ready · ${M._ds_width()}x${M._ds_height()} · page ${M._ds_cur_page()} · ${M._ds_page_count()} pages`;
    rebuildPages(); rebuildTracks(); buildPanel(); buildKeys(); buildEncs(); buildSound(); wireMix();
    const $play = document.getElementById("play");
    let last = performance.now();
    const loop = () => {
      if (!M) return;
      const t = performance.now();
      if (t - last >= 33) { last = t; if (!soundOn) M._ds_frame(); paint(); refresh(); }
    };
    setInterval(loop, 33);                          /* a timer, not rAF: virtual time drives it, no vblank race */
    document.getElementById("err").textContent = "";
  } catch (e) {
    const err = document.getElementById("err");
    err.textContent = "dev screen failed to start: " + e.message;
    console.error(e);
  }
</script>
</body>
</html>
